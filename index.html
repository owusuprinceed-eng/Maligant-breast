<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malignant Disease of the Breast: PBL Assessment</title>
<style>
:root{--ink:#16202c;--muted:#5b6878;--line:#dfe4ea;--bg:#f5f3ee;--navy:#173a5e;--red:#b42318;--redbg:#fdecea;--amber:#a15c07;--amberbg:#fef4e2;--green:#1f7a4d;--greenbg:#e8f5ee}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--navy);transition:width .3s}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.head{background:var(--navy);color:#fff;padding:16px 18px}
.head small{opacity:.75;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px}
.head h1{font-family:Georgia,serif;font-weight:normal;font-size:24px;margin:4px 0 2px}
.head div{opacity:.85;font-size:14px}
.body{padding:14px 18px 18px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
p{margin:6px 0}
ul{margin:4px 0;padding-left:20px}
li{margin:3px 0}
.hl{background:#fff3b0;padding:0 3px;border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td.v{font-weight:700;white-space:nowrap}
td.n{color:var(--muted);font-size:13px}
tr.h td.v{color:var(--red)} tr.b td.v{color:var(--amber)}
.f{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
tr.h .f{color:var(--red);background:var(--redbg)} tr.b .f{color:var(--amber);background:var(--amberbg)} tr.ok .f{color:var(--green);background:var(--greenbg)}
.img{background:#f2f5f9;border-left:4px solid var(--navy);padding:8px 12px;border-radius:0 6px 6px 0;font-size:15px}
button{font:inherit;cursor:pointer;border-radius:8px}
.voice{margin-top:12px;border:1px solid #6b4fa0;color:#6b4fa0;background:#fff;padding:7px 13px;font-size:14px}
.voice.on{background:#6b4fa0;color:#fff}
.q{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:none}
.q.show{display:block}
.update{background:var(--amberbg);border-left:4px solid var(--amber);padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:10px;font-size:15px}
.update b:first-child{color:var(--amber)}
.qt{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);padding:10px 12px;margin:7px 0;font-size:15px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.exp{display:none;margin-top:8px;padding:10px 12px;border-radius:8px;font-size:14.5px;background:#f4f7fa}
.exp.show{display:block}
.exp .verdict{font-weight:700}
.exp .verdict.ok{color:var(--green)} .exp .verdict.no{color:var(--red)}
.term{color:var(--navy);font-weight:600}
.pearl{display:none;margin-top:16px;background:var(--navy);color:#fff;border-radius:8px;padding:11px 14px;font-size:15px}
.pearl.show{display:block}
.pearl b{color:#ffd27a}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav button{padding:10px 18px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:15px}
.nav button.next{background:var(--navy);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.end{text-align:center;padding:30px 20px}
.end .big{font-family:Georgia,serif;font-size:44px;color:var(--navy)}
.end ul{text-align:left;max-width:520px;margin:14px auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span id="where"></span><span id="score"></span></div>
  <div class="prog"><i id="pbar"></i></div>
  <div id="stage"></div>
  <div class="nav">
    <button id="prev">◂ Previous</button>
    <button id="next" class="next">Next case ▸</button>
  </div>
</div>

<script>
/* v: [label, value, normal, flag h|b|ok] */
const CASES=[
{
  title:"The lump at the health centre", setting:"Primary health centre, Ashanti",
  pc:"Auntie Afia, 46 F, trader. <span class='hl'>Painless breast lump for 3 months</span>, getting bigger.",
  exam:["<span class='hl'>Hard, irregular</span> 3 cm lump, left upper outer quadrant","<span class='hl'>Nipple retraction</span> on the left","Firm 1.5 cm left axillary node"],
  v:[["Lump","Hard, irregular, painless","Benign: smooth, mobile, rubbery","h"],["Nipple","Retracted","Normal: everted","h"],["Axilla","Palpable node","No nodes","h"]],
  img:"No imaging available at the health centre.",
  qs:[
    {q:"Which feature is the MOST common presentation of breast cancer?",o:["Bone pain","Painless, hard, irregular lump","Bilateral clear nipple discharge","Breast pain only"],a:1,
     e:"A <b>painless, hard, irregular lump</b> is the commonest presentation. Other warning signs: <b>skin dimpling or ulceration, peau d'orange, nipple retraction, bloody discharge, axillary nodes</b>."},
    {q:"How is the diagnosis confirmed?",o:["Clinical examination alone","Mammography alone","Triple assessment: clinical exam + imaging + pathology","Blood tests"],a:2,
     e:"<span class='term'>Triple assessment</span>: (1) history and examination, (2) <b>imaging</b> (mammography, ultrasound), (3) <b>pathology</b> (<span class='term'>FNAC</span> = fine-needle aspiration cytology, or core biopsy)."},
    {q:"What is the key action at the health centre?",o:["Reassure, review in 6 months","Start chemotherapy","Prompt referral to a higher level of care","Give antibiotics and wait"],a:2,
     e:"The primary care role is <b>early detection and prompt referral</b>, plus education, psychological support, and later survivorship and palliative care."}
  ],
  pearl:"Hard, irregular, painless lump + nipple retraction = refer now, not later."
},
{
  title:"The worried sister", setting:"Surgical OPD · risk counselling",
  pc:"Esi, 38 F, banker. Her <span class='hl'>mother (42) and sister (39) both had breast cancer</span>. She wants to know her risk.",
  exam:["Menarche at <span class='hl'>11 years</span>","<span class='hl'>Never had a baby</span>","Drinks alcohol most weekends; BMI 33","Mammogram: <span class='hl'>dense breasts (>75%)</span>"],
  v:[["First-degree relatives","2, both < 45 yrs","More relatives + younger age = higher risk","h"],["Menarche","11 yrs","Lower risk if ≥ 15","b"],["Parity","Nulliparous","Childbirth is protective","b"],["BMI","33","18.5–24.9","h"],["Breast density","> 75%","Higher density = higher risk","h"]],
  img:"Mammogram: no mass; extremely dense breast tissue.",
  qs:[
    {q:"Which of her risk factors is MODIFIABLE?",o:["Family history","Early menarche","Alcohol intake and obesity","Female sex"],a:2,
     e:"<b>Modifiable:</b> obesity, alcohol, smoking, inactivity, late or no childbirth, hormonal therapy (long-term COC/HRT). <b>Non-modifiable:</b> age, sex, family history, BRCA1/2, early menarche, late menopause."},
    {q:"Which inherited mutation should she be tested for?",o:["BRCA1/2","HER2","p53 only after menopause","Factor V Leiden"],a:0,
     e:"<b>BRCA1/2</b> pathogenic variants are the classic inherited cause. Family-history risk depends on the <b>number of first-degree relatives affected</b> and <b>how young</b> they were at diagnosis."},
    {q:"Which reproductive factor is PROTECTIVE?",o:["Nulliparity","Menarche before 13","Multiparity (several births)","First pregnancy after 35"],a:2,
     e:"Parity protects for decades, and <b>multiparity more so</b>. A first full-term pregnancy after 35 carries about the same risk as never having a baby. Pregnancy matures breast cells fully (<span class='term'>differentiation</span>), making them less prone to cancer."}
  ],
  pearl:"Family history risk = how many first-degree relatives + how young."
},
{
  title:"The calcifications", setting:"Breast imaging clinic",
  pc:"Mrs Boateng, 50 F, asymptomatic. Screening mammogram.",
  exam:["Nothing palpable"],
  v:[["Mammogram","Clustered microcalcifications","No calcifications","h"],["Biopsy","Ductal carcinoma in situ (DCIS)","",'b']],
  img:"Stereotactic biopsy: <span class='hl'>DCIS</span>. Cancer cells are confined within the duct, not through the basement membrane.",
  qs:[
    {q:"Where does breast cancer most commonly arise from?",o:["Fat cells","Ductal or lobular epithelium","Skin","Pectoral muscle"],a:1,
     e:"Breast cancer arises mostly from the <b>ductal or lobular epithelium</b> (the lining cells of the milk ducts and lobules)."},
    {q:"What is the usual order of progression?",o:["Invasive → in situ → hyperplasia","Atypical hyperplasia → in situ carcinoma → invasive cancer","In situ → hyperplasia → invasive","Invasive → metastasis → in situ"],a:1,
     e:"DNA mutation → <b>atypical hyperplasia → carcinoma in situ</b> (still inside the duct) <b>→ invasive</b> (breaks out) → spread via <b>lymphatics and bloodstream</b>. DCIS often shows as <b>microcalcifications</b> on mammogram."}
  ],
  pearl:"DCIS = cancer still inside the duct, often seen only as calcifications."
},
{
  title:"The prayer camp", setting:"Surgical OPD, KATH",
  pc:"Maame Yaa, 52 F. Lump for <span class='hl'>2 years</span>; went to a herbalist and a prayer camp first. Now the breast is <span class='hl'>ulcerated and smelly</span>.",
  exam:["8 cm mass, <span class='hl'>fixed to the chest wall</span>","<span class='hl'>Peau d'orange</span>: skin like orange peel","Skin ulceration","Matted axillary nodes"],
  v:[["Tumour size","8 cm","Early: small, in breast","h"],["Skin","Ulcerated, peau d'orange","Intact","h"],["Chest wall","Fixed","Mobile","h"]],
  img:"Core biopsy: invasive ductal carcinoma.",
  qs:[
    {q:"How would you stage this broadly?",o:["Early stage","Locally advanced","In situ","Benign"],a:1,
     e:"<b>Locally advanced:</b> large tumour, <b>skin or chest-wall involvement</b>. Early stage is confined to the breast ± local nodes. Metastatic means spread to lungs, liver, bone or brain. <span class='term'>Peau d'orange</span> is skin swelling from blocked lymphatics."},
    {q:"Which investigations stage her (look for spread)?",o:["Repeat mammogram only","CT chest + abdominal ultrasound, bone scan if indicated","Full blood count only","FNAC of the axilla only"],a:1,
     e:"Current staging: <b>CT chest and ultrasound of the abdomen</b>, plus <b>bone scan where indicated</b> (e.g. bone pain)."},
    {q:"Why do most Ghanaian women present this late?",o:["Breast cancer is rare in Ghana","Stigma and myths, limited access, financial constraints","Tumours grow slower in Africa","Screening is universal"],a:1,
     e:"Challenges: <b>stigma and myths</b> delay care-seeking, <b>few diagnostic and treatment facilities</b>, and <b>financial and workforce constraints</b>. Most present at an advanced stage."}
  ],
  pearl:"Peau d'orange, ulceration or chest-wall fixation = locally advanced."
},
{
  title:"The back pain that wasn't arthritis", setting:"Medical ward",
  pc:"Mrs Asante, 58 F, had a breast lump she ignored for a year. Now: <span class='hl'>back pain, breathlessness, yellow eyes</span>, weight loss.",
  exam:["Jaundiced","Reduced breath sounds, right base","Tender thoracic spine","Hard, irregular right breast mass"],
  v:[["Weight loss","8 kg in 3 months","No unintentional loss","h"],["SpO₂","91%","≥ 95%","h"],["Bilirubin","68 µmol/L","< 21","h"]],
  img:"CT chest: lung nodules and pleural effusion. Ultrasound: multiple liver lesions. Bone scan: spinal deposits.",
  qs:[
    {q:"Each symptom points to spread to which organ?",o:["Breathlessness → lung, jaundice → liver, bone pain → bone","Jaundice → lung, bone pain → kidney","All due to anaemia","Breathlessness → heart failure only"],a:0,
     e:"Advanced signs map to <b>metastases</b>: lungs (breathlessness), liver (jaundice), bone (pain, fractures) and brain. Spread is via <b>lymphatics and the bloodstream</b>."},
    {q:"What does her care need most?",o:["Mastectomy alone","Multidisciplinary care with systemic therapy, palliative and psychological support","Discharge home","Antibiotics only"],a:1,
     e:"Breast cancer care is <b>multidisciplinary</b>. In metastatic disease, <b>systemic therapy</b> (chemotherapy, hormonal, targeted) plus <b>palliative care and psychological support</b> take priority over surgery."}
  ],
  pearl:"Weight loss, bone pain, breathlessness, jaundice = think metastatic disease."
},
{
  title:"The early catch", setting:"Breast MDT meeting",
  pc:"Mrs Mensah, 44 F, Black Ghanaian woman, <span class='hl'>2 cm invasive tumour</span>, <span class='hl'>no nodes, no distant spread</span>.",
  exam:["Mobile 2 cm lump","No skin changes","Axilla clear"],
  v:[["Tumour","2 cm","Small","b"],["Nodes","None","",'ok'],["Metastases","None on staging","",'ok']],
  img:"Staging CT and abdominal ultrasound: clear.",
  qs:[
    {q:"Which treatments are part of breast cancer management?",o:["Surgery only","Surgery, radiotherapy and systemic therapy via an MDT","Herbal treatment","Radiotherapy only"],a:1,
     e:"<b>MDT approach:</b> surgery (<span class='term'>lumpectomy</span> = remove the lump only, breast kept; or <span class='term'>mastectomy</span> = remove the whole breast), <b>radiotherapy</b>, and systemic therapy (<b>chemo, hormonal, targeted</b>)."},
    {q:"Why are Black women's outcomes worse?",o:["Higher incidence only","More aggressive disease and later presentation","Less effective surgery","They don't get breast cancer"],a:1,
     e:"Black women have <b>~5% lower incidence but ~44% greater mortality</b>, because they tend to have <b>more aggressive disease</b> and present later."},
    {upd:"A different patient: a <b>rapidly growing</b> large breast mass. Biopsy shows a rare malignancy.",
     q:"Which is listed as a rare breast malignancy?",o:["Fibroadenoma","Phyllodes tumour","Galactocele","Radial scar"],a:1,
     e:"Rare breast malignancies: <b>phyllodes tumour</b>, <b>sarcoma</b> (angiosarcoma, liposarcoma), <b>lymphoma</b> and <b>melanoma</b>. Remember from the benign lecture that a giant fibroadenoma must be distinguished from phyllodes."}
  ],
  pearl:"Early detection makes curative treatment possible. A prior breast cancer also raises the risk in the other breast."
}
];

const state=CASES.map(c=>c.qs.map(()=>null));
let cur=0, speaking=null;
const $=id=>document.getElementById(id);

function scoreTxt(){
  let r=0,t=0;state.forEach(c=>c.forEach(a=>{if(a!==null){t++;if(a.ok)r++;}}));
  const total=state.reduce((s,c)=>s+c.length,0);
  return `Score ${r}/${t} · ${total} questions`;
}

function show(i){
  if(speaking)speechSynthesis.cancel();
  cur=i;
  window.scrollTo({top:0});
  $('prev').disabled=i===0;
  if(i===CASES.length){return showEnd();}
  $('next').textContent=i===CASES.length-1?'Finish ▸':'Next case ▸';
  $('next').style.display='';
  const c=CASES[i];
  $('where').textContent=`Case ${i+1} of ${CASES.length}`;
  $('pbar').style.width=((i+1)/CASES.length*100)+'%';
  $('score').textContent=scoreTxt();
  const vit=c.v.map(x=>`<tr class="${x[3]}"><td>${x[0]}</td><td class="v">${x[1]}</td><td class="n">${x[2]}</td><td><span class="f">${x[3]==='h'?'CONCERNING':x[3]==='b'?'NOTE':'REASSURING'}</span></td></tr>`).join('');
  const qs=c.qs.map((q,j)=>`
    <div class="q" id="q${j}">
      ${q.upd?`<div class="update"><b>Update:</b> ${q.upd}</div>`:''}
      <div class="qt">Q${j+1}. ${q.q}</div>
      ${q.o.map((o,k)=>`<button class="opt" data-q="${j}" data-k="${k}">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}
      <div class="exp" id="e${j}"></div>
    </div>`).join('');
  $('stage').innerHTML=`
  <div class="card">
    <div class="head"><small>Patient report</small><h1>${c.title}</h1><div>${c.setting}</div></div>
    <div class="body">
      <div id="rep">
        <p>${c.pc}</p>
        <h3>Findings</h3><ul>${c.exam.map(e=>`<li>${e}</li>`).join('')}</ul>
        <h3>Key findings</h3><table>${vit}</table>
        <h3>Imaging</h3><div class="img">${c.img}</div>
      </div>
      <button class="voice" id="vbtn">🔊 Listen to report</button>
      ${qs}
      <div class="pearl" id="pearl"><b>Take-home:</b> ${c.pearl}</div>
    </div>
  </div>`;
  $('vbtn').onclick=()=>speak($('vbtn'));
  // restore answered state
  let open=0;
  c.qs.forEach((q,j)=>{
    if(state[i][j]!==null){paint(j,state[i][j].k);open=j+1;}
  });
  for(let j=0;j<=Math.min(open,c.qs.length-1);j++)$('q'+j).classList.add('show');
  if(open===c.qs.length)$('pearl').classList.add('show');
}

function paint(j,k){
  const q=CASES[cur].qs[j];
  document.querySelectorAll(`.opt[data-q="${j}"]`).forEach(b=>{
    b.disabled=true;const bk=+b.dataset.k;
    if(bk===q.a)b.classList.add('right');else if(bk===k)b.classList.add('wrong');
  });
  const ok=k===q.a;
  const e=$('e'+j);
  e.innerHTML=`<span class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct.':'✗ Not quite. Answer: '+String.fromCharCode(65+q.a)+'.'}</span> ${q.e}`;
  e.classList.add('show');
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('.opt');if(!b||b.disabled)return;
  const j=+b.dataset.q,k=+b.dataset.k;
  state[cur][j]={k,ok:k===CASES[cur].qs[j].a};
  paint(j,k);
  $('score').textContent=scoreTxt();
  const nq=$('q'+(j+1));
  if(nq){nq.classList.add('show');setTimeout(()=>nq.scrollIntoView({behavior:'smooth',block:'nearest'}),250);}
  else{$('pearl').classList.add('show');}
});

function showEnd(){
  let r=0,t=0;state.forEach(c=>c.forEach(a=>{t++;if(a&&a.ok)r++;}));
  $('where').textContent='Done';$('pbar').style.width='100%';$('score').textContent='';
  $('next').style.display='none';
  $('stage').innerHTML=`<div class="card"><div class="end">
    <div class="big">${r} / ${t}</div>
    <p>Five things to remember for tomorrow:</p>
    <ul>
      <li>Most common cancer and leading cause of cancer death in women. In Ghana, <b>most present late</b>.</li>
      <li><b>Modifiable risks:</b> obesity, alcohol, smoking, inactivity, late/no childbirth, HRT/COC. <b>Non-modifiable:</b> age, sex, family history, BRCA1/2, early menarche, late menopause.</li>
      <li>Commonest sign: <b>painless, hard, irregular lump</b>. Also skin dimpling, peau d'orange, nipple retraction, bloody discharge, axillary nodes.</li>
      <li><b>Triple assessment</b> = clinical exam + imaging + pathology. <b>Stage</b> with CT chest + abdominal US (± bone scan).</li>
      <li>Management is <b>MDT</b>: surgery, radiotherapy, systemic therapy. Primary care: educate, detect early, <b>refer promptly</b>, support.</li>
    </ul>
    <button class="voice" onclick="location.reload()">↺ Start again</button>
  </div></div>`;
}

function speak(btn){
  if(!('speechSynthesis' in window)){alert('Voice-over needs Chrome or Edge.');return;}
  if(speaking){speechSynthesis.cancel();return;}
  const rows=[...document.querySelectorAll('#rep tr')].map(r=>{const c=[...r.children].map(t=>t.innerText);return `${c[0]}: ${c[1]}, ${c[2]}, ${c[3].toLowerCase()}.`;}).join(' ');
  const rep=$('rep').cloneNode(true);rep.querySelector('table').remove();
  rep.querySelectorAll('li').forEach(l=>l.textContent=l.textContent+'. ');
  let t=CASES[cur].title+'. '+rep.innerText.replace('Key findings','Key findings. '+rows).replace(/Findings|Imaging/g,m=>m+'. ');
  t=t.replace(/(\d)\/(\d)/g,'$1 over $2').replace(/\/min/g,' per minute').replace(/g\/dL/g,'grams per decilitre').replace(/mmol\/L/g,'millimoles per litre').replace(/U\/L/g,'units per litre').replace(/°C/g,' degrees').replace(/−/g,'minus ').replace(/≥/g,'at least ').replace(/</g,'less than ').replace(/~/g,'about ').replace(/\bSBP\b/g,'systolic').replace(/SpO₂/g,'oxygen saturation');
  const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.lang='en-GB';
  const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
  btn.textContent='⏹ Stop';btn.classList.add('on');speaking=u;
  u.onend=u.onerror=()=>{btn.textContent='🔊 Listen to report';btn.classList.remove('on');speaking=null;};
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window)speechSynthesis.getVoices();

$('prev').onclick=()=>show(cur-1);
$('next').onclick=()=>show(cur+1);
show(0);
</script>
</body>
</html>
